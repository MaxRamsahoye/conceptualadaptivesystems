<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Slides</title>
  <meta name="description" content="A library of slide decks.">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/slides.css">
  <link rel="stylesheet" href="assets/css/site.css">
</head>
<body class="library">
  <header class="lib-head">
    <div class="lib-head-inner">
      <h1 id="site-title">Slides</h1>
      <p id="site-desc" class="lib-desc">Decks written in Markdown, presented in the browser.</p>
    </div>
  </header>
  <main class="lib-main">
    <div class="toolbar">
      <label class="search">
        <span class="sr-only">Search decks</span>
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
        <input id="search" type="search" placeholder="Search decks" autocomplete="off">
        <kbd aria-hidden="true">/</kbd>
      </label>
      <span id="count" class="count" aria-live="polite"></span>
    </div>
    <p id="status" class="status" hidden></p>
    <ul id="decks" class="grid"></ul>
  </main>
  <footer class="lib-foot">
    <p>Open a deck, then press <kbd>?</kbd> for shortcuts. <kbd>S</kbd> opens presenter view.</p>
  </footer>
  <script type="module" src="assets/js/library.js"></script>
</body>
</html>
